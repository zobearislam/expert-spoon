<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Transport Framework</title>
<style>
:root{--bg:#f5f6f8;--fg:#14181f;--card:#fff;--mut:#6b7280;--ac:#2563eb;--bd:#d9dde3;--ok:#16a34a;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--fg:#e6e9ef;--card:#171b24;--mut:#8b93a3;--ac:#5b9bff;--bd:#2a3040;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1117;--fg:#e6e9ef;--card:#171b24;--mut:#8b93a3;--ac:#5b9bff;--bd:#2a3040;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
nav{display:flex;gap:4px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10;flex-wrap:wrap}
nav button{padding:8px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:900px;margin:0 auto;padding:12px}
.screen{display:none}.screen.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h1{font-size:20px;margin:0 0 12px}
h2{font-size:16px;margin:0 0 10px}
canvas{width:100%;height:420px;display:block;border-radius:10px;touch-action:none;background:var(--bg)}
small,.mut{color:var(--mut)}
.hier details{margin:4px 0 4px 10px}
.hier summary{cursor:pointer;font-weight:500}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.form input,.form select,button{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
button.primary{background:var(--ac);color:#fff;border-color:var(--ac)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.list-item{padding:8px 0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.credits{font-weight:600;color:var(--ac)}
</style></head><body>
<nav>
  <button data-s="map" class="on">Map</button>
  <button data-s="pilots">Pilots</button>
  <button data-s="vehicles">Vehicles</button>
  <button data-s="lanes">Lanes</button>
  <button data-s="deals">Deals</button>
  <span style="margin-left:auto" class="credits" id="cred">Credits: 10000</span>
</nav>
<main>
  <div id="map" class="screen on">
    <div class="card">
      <h1>Star Map</h1>
      <canvas id="cv"></canvas>
      <div class="mut" style="margin-top:8px">Drag to orbit · pinch/scroll to zoom · tap a system</div>
      <div id="sel" class="hier" style="margin-top:10px"></div>
    </div>
  </div>
  <div id="pilots" class="screen">
    <div class="card">
      <h2>Hire Pilots</h2>
      <div class="form">
        <input id="pname" placeholder="Pilot name" style="flex:1">
        <button class="primary" id="hire">Hire (500 cr)</button>
      </div>
      <div id="plist"></div>
    </div>
  </div>
  <div id="vehicles" class="screen">
    <div class="card">
      <h2>Buy Vehicles</h2>
      <div id="vtypes"></div>
      <h2 style="margin-top:16px">Your Fleet</h2>
      <div id="vlist"></div>
    </div>
  </div>
  <div id="lanes" class="screen">
    <div class="card">
      <h2>Assign Lanes</h2>
      <div id="laneform"></div>
      <div id="lanelist"></div>
    </div>
  </div>
  <div id="deals" class="screen">
    <div class="card">
      <h2>Future Deals</h2>
      <div id="dealform"></div>
      <div id="deallist"></div>
    </div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ========== EDIT MAP DATA HERE ========== */
// o: "equatorial"|"circular"|"polar"|"inclined"|null
// Vehicle types: add more objects here (capacity, speed, cost, fuel)
const CFG={
  labels:{system:"System",gate:"Gate"},
  factions:{terran:{name:"Terran Union",color:"#4da3ff"},traders:{name:"Free Traders",color:"#ffb84d"},none:{name:"Unclaimed",color:"#9aa3b2"}},
  mapImage:null,
  vehicleTypes:[
    {id:"freighter",name:"Freighter",capacity:100,speed:2,cost:2000,fuel:"antimatter",icon:null},
    {id:"tanker",name:"Tanker",capacity:80,speed:1.5,cost:2500,fuel:"antimatter",icon:null},
    {id:"courier",name:"Courier",capacity:20,speed:4,cost:1200,fuel:"fusion",icon:null}
  ]
};
const U={
  credits:10000,
  systems:[
    {id:"s1",name:"Sol",x:0,y:0,z:0,f:"terran",icon:null,bodies:[
      {id:"sun",type:"star",name:"Sun",o:null,resources:["energy"],fuel:"fusion",stations:[{id:"solsta",name:"Sol Station",o:"equatorial",resources:["fuel"]}]},
      {id:"earth",type:"planet",name:"Earth",parent:"sun",o:"circular",resources:["water","food"],fuel:"antimatter",
        locations:[{id:"ny",name:"New York",x:40,y:-74,type:"dayside"}],
        stations:[{id:"iss",name:"Orbital Hub",o:"equatorial",resources:["cargo"]}]},
      {id:"luna",type:"moon",name:"Luna",parent:"earth",o:"circular",resources:["metals"],stations:[{id:"lunasta",name:"Luna Base",o:"polar",resources:["ore"]}]}
    ]},
    {id:"s2",name:"Vega",x:25,y:-10,z:8,f:"terran",bodies:[{id:"vega",type:"star",name:"Vega",o:null,resources:["rare"],fuel:"antimatter"}]},
    {id:"s3",name:"Altair",x:-20,y:18,z:-6,f:"traders",bodies:[]},
    {id:"s4",name:"Rigel",x:10,y:30,z:14,f:"traders",bodies:[]},
    {id:"s5",name:"Deneb",x:-30,y:-22,z:10,f:"none",bodies:[]},
    {id:"s6",name:"Kepler",x:38,y:18,z:-8,f:"none",bodies:[]}
  ],
  gates:[["s1","s2",4],["s1","s3",6],["s2","s6",3],["s3","s4",5],["s1","s5",7],["s4","s6",4]],
  pilots:[{id:"p1",name:"Ace"},{id:"p2",name:"Nova"}],
  vehicles:[],
  lanes:[],
  deals:[]
};
/* ======================================== */
const $=s=>document.querySelector(s),css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim(),fcol=f=>(CFG.factions[f]||CFG.factions.none).color;
let screen="map",selId=null,dirty=1;
const cv=$("#cv"),R=new THREE.WebGLRenderer({canvas:cv});R.setPixelRatio(Math.min(devicePixelRatio||1,2));
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,1,.1,1000),grp=new THREE.Group(),O={th:.8,ph:1,r:85};
sc.add(grp);const grid=new THREE.GridHelper(100,20);sc.add(grid);
const mp=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshBasicMaterial({transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
mp.rotation.x=-Math.PI/2;mp.position.y=-.05;sc.add(mp);
if(CFG.mapImage)new THREE.TextureLoader().load(CFG.mapImage,t=>{mp.material.map=t;mp.material.opacity=.75;mp.material.needsUpdate=true;dirty=1});
function setCam(){cam.position.set(O.r*Math.sin(O.ph)*Math.cos(O.th),O.r*Math.cos(O.ph),O.r*Math.sin(O.ph)*Math.sin(O.th));cam.lookAt(0,0,0);dirty=1}
function resize(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();dirty=1}
function label(t,col){const c=document.createElement("canvas");c.width=256;c.height=64;const x=c.getContext("2d");x.font="bold 30px system-ui";x.textAlign="center";x.fillStyle=col;x.fillText(t,128,42);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));s.scale.set(12,3,1);s.position.y=3;return s}
function rebuild(){
  grp.children.slice().forEach(o=>{grp.remove(o);o.geometry&&o.geometry.dispose();o.material&&(o.material.map&&o.material.map.dispose(),o.material.dispose())});
  const fg=css("--fg"),mut=css("--mut"),ac=css("--ac");R.setClearColor(css("--bg"));
  grid.material.color.set(mut);grid.material.opacity=.35;grid.material.transparent=true;
  const P=s=>new THREE.Vector3(s.x,s.z,s.y),by=id=>U.systems.find(s=>s.id==id),gp=[],dp=[];
  U.systems.forEach(s=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(1.6,14,10),new THREE.MeshBasicMaterial({color:fcol(s.f)}));m.position.copy(P(s));m.userData.id=s.id;grp.add(m);
    const l=label(s.name,fg);l.position.add(P(s));grp.add(l);
    if(s.id==selId){const r=new THREE.Mesh(new THREE.SphereGeometry(2.3,12,8),new THREE.MeshBasicMaterial({color:ac,wireframe:true}));r.position.copy(P(s));grp.add(r)}
    const p=P(s);dp.push(p.x,p.y,p.z,p.x,0,p.z)});
  U.gates.forEach(g=>{const a=by(g[0]),b=by(g[1]);if(a&&b){const p=P(a),q=P(b);gp.push(p.x,p.y,p.z,q.x,q.y,q.z)}});
  const ls=(arr,col,op)=>{const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(arr,3));grp.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op})))};
  ls(dp,mut,.35);ls(gp,ac,1);dirty=1;renderUI();
}
const ptr=new Map();let down=null,pd=0;
const pinch=()=>{const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);down={x:e.clientX,y:e.clientY,t:Date.now(),n:ptr.size};if(ptr.size==2)pd=pinch()});
cv.addEventListener("pointermove",e=>{const p=ptr.get(e.pointerId);if(!p)return;
  if(ptr.size==1){O.th-=(e.clientX-p[0])*.01;O.ph=Math.min(3,Math.max(.1,O.ph-(e.clientY-p[1])*.01))}
  ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size==2){const d=pinch();O.r=Math.min(250,Math.max(15,O.r*pd/d));pd=d}setCam()});
cv.addEventListener("pointerup",e=>{if(ptr.size==1&&down&&down.n==1&&Date.now()-down.t<400&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<8)tap(e);ptr.delete(e.pointerId)});
cv.addEventListener("pointercancel",e=>ptr.delete(e.pointerId));
cv.addEventListener("wheel",e=>{e.preventDefault();O.r=Math.min(250,Math.max(15,O.r*(1+e.deltaY*.001)));setCam()},{passive:false});
const ray=new THREE.Raycaster();
function tap(e){const r=cv.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),cam);
  const h=ray.intersectObjects(grp.children.filter(o=>o.userData.id));
  selId=h.length?h[0].object.userData.id:null;rebuild()}
function bodyHtml(b){
  const res=(b.resources||[]).join(", ")||"—";
  const st=(b.stations||[]).map(s=>`<div>${s.name} <small>(o: ${s.o||"none"}, res: ${(s.resources||[]).join(", ")||"—"}${s.fuel?", fuel: "+s.fuel:""})</small></div>`).join("");
  const locs=(b.locations||[]).map(l=>`<div class="loc">${l.name} @ (${l.x},${l.y}) <small>type: ${l.type||"—"}</small></div>`).join("");
  return `<details open><summary>${b.name} <small>(${b.type}${b.o?", o: "+b.o:""}, res: ${res}${b.fuel?", fuel: "+b.fuel:""})</small></summary>${st}${locs}</details>`;
}
function renderUI(){
  $("#cred").textContent=`Credits: ${U.credits}`;
  const s=U.systems.find(x=>x.id==selId);
  if(s){
    const bodies=(s.bodies||[]).map(bodyHtml).join("");
    const gtimes=U.gates.filter(g=>g.includes(s.id)).map(g=>{const o=g[0]==s.id?g[1]:g[0];const os=U.systems.find(x=>x.id==o);return os?`${os.name} (${g[2]}t)`:"";}).filter(Boolean).join(", ");
    $("#sel").innerHTML=`<b>${s.name}</b> · ${CFG.factions[s.f]?.name||s.f}<br><small>pos ${s.x}, ${s.y}, ${s.z} · gates: ${gtimes||"none"}</small><div>${bodies||"<small>No bodies</small>"}</div>`;
  }else $("#sel").innerHTML=`<span class="mut">${U.systems.length} systems, ${U.gates.length} gates</span>`;
  // pilots
  $("#plist").innerHTML=U.pilots.map((p,i)=>`<div class="list-item">${p.name} <button data-rmp="${i}">Fire</button></div>`).join("")||"<small>No pilots hired</small>";
  // vehicles
  $("#vtypes").innerHTML=CFG.vehicleTypes.map(t=>`<div class="list-item">${t.name} <small>cap ${t.capacity} · spd ${t.speed} · ${t.fuel}</small> <button class="ok" data-buy="${t.id}">Buy ${t.cost} cr</button></div>`).join("");
  $("#vlist").innerHTML=U.vehicles.map((v,i)=>`<div class="list-item">${v.name} (${v.type}) <button data-rmv="${i}">Sell</button></div>`).join("")||"<small>No vehicles owned</small>";
  // lanes
  const sysOpts=U.systems.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
  const pOpts=U.pilots.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
  const vOpts=U.vehicles.map(v=>`<option value="${v.id}">${v.name}</option>`).join("");
  const resSet=new Set();U.systems.forEach(sy=>(sy.bodies||[]).forEach(b=>{(b.resources||[]).forEach(r=>resSet.add(r));(b.stations||[]).forEach(st=>(st.resources||[]).forEach(r=>resSet.add(r)))}));
  const rOpts=[...resSet].map(r=>`<option>${r}</option>`).join("")||`<option>antimatter</option>`;
  $("#laneform").innerHTML=`<div class="form"><select id="lf">${sysOpts}</select>→<select id="lt">${sysOpts}</select><select id="lr">${rOpts}</select><select id="lp" multiple size="2">${pOpts}</select><select id="lv" multiple size="2">${vOpts}</select><button class="primary" id="la">Assign</button></div>`;
  $("#lanelist").innerHTML=U.lanes.map((l,i)=>`<div class="list-item">${name(l.from)} → ${name(l.to)} · ${l.resource} · ${l.pilots.length}p/${l.vehicles.length}v <button data-rml="${i}">×</button></div>`).join("")||"<small>No lanes</small>";
  // deals
  $("#dealform").innerHTML=`<div class="form"><select id="df">${sysOpts}</select>→<select id="dt">${sysOpts}</select><select id="dr">${rOpts}</select><input id="dy" type="number" min="1" value="5" style="width:60px" placeholder="years"><input id="dp" type="number" min="0" value="100" style="width:70px" placeholder="price"><input id="dq" type="number" min="1" value="10" style="width:70px" placeholder="qty"><button class="primary" id="da">Strike</button></div>`;
  $("#deallist").innerHTML=U.deals.map((d,i)=>`<div class="list-item">${name(d.from)} → ${name(d.to)} · ${d.resource} · ${d.years}y @ ${d.price} · ${d.qty}/yr <button data-rmd="${i}">×</button></div>`).join("")||"<small>No deals</small>";
  // events
  document.querySelectorAll("[data-rmp]").forEach(b=>b.onclick=()=>{U.pilots.splice(+b.dataset.rmp,1);renderUI()});
  document.querySelectorAll("[data-rmv]").forEach(b=>b.onclick=()=>{U.vehicles.splice(+b.dataset.rmv,1);renderUI()});
  document.querySelectorAll("[data-rml]").forEach(b=>b.onclick=()=>{U.lanes.splice(+b.dataset.rml,1);renderUI()});
  document.querySelectorAll("[data-rmd]").forEach(b=>b.onclick=()=>{U.deals.splice(+b.dataset.rmd,1);renderUI()});
  document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{
    const t=CFG.vehicleTypes.find(x=>x.id==b.dataset.buy);
    if(t&&U.credits>=t.cost){U.credits-=t.cost;U.vehicles.push({id:"v"+Date.now(),name:t.name+" #"+ (U.vehicles.length+1),type:t.id,...t});renderUI()}
  });
  $("#hire").onclick=()=>{const n=$("#pname").value.trim();if(n&&U.credits>=500){U.credits-=500;U.pilots.push({id:"p"+Date.now(),name:n});$("#pname").value="";renderUI()}};
  $("#la").onclick=()=>{const from=$("#lf").value,to=$("#lt").value,resource=$("#lr").value,pilots=[...$("#lp").selectedOptions].map(o=>o.value),vehicles=[...$("#lv").selectedOptions].map(o=>o.value);
    if(from&&to&&from!=to&&resource&&(pilots.length||vehicles.length)){U.lanes.push({from,to,resource,pilots,vehicles});renderUI()}};
  $("#da").onclick=()=>{const from=$("#df").value,to=$("#dt").value,resource=$("#dr").value,years=+$("#dy").value||1,price=+$("#dp").value||0,qty=+$("#dq").value||1;
    if(from&&to&&from!=to&&resource&&years>0){U.deals.push({from,to,resource,years,price,qty});renderUI()}};
}
function name(id){return U.systems.find(s=>s.id==id)?.name||id}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  screen=b.dataset.s;document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$("#"+screen).classList.add("on");
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x==b));
  if(screen=="map")resize();
});
addEventListener("resize",resize);
(function loop(){if(dirty){R.render(sc,cam);dirty=0}requestAnimationFrame(loop)})();
resize();setCam();rebuild();
</script></body></html>
